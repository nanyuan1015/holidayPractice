<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .toolbar {
            margin-bottom:20px;
            display:flex;
            gap:14px;
            align-items:center;
            flex-wrap:wrap;
        }
        .cart-text{
            margin-left:auto;
            font-weight:bold;
        }
        .container{
            padding:20px;
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:16px;
        }
        .card{
            border:1px solid #ccc;
            padding:12px;
            border-radius:8px;
            cursor: pointer;
            display:flex;
            flex-direction:column;
        }
        .card.active{
            border:3px solid #2b78e4;
        }
        .card img{
            width:100%;
            height:180px;
            object-fit:cover;
        }
        .card-footer{
            margin-top:auto;
            margin-top:10px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        button{
            padding:4px 8px;
        }
        .tip-empty {
            color:#999;
            font-size:18px;
            padding:10px 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <h2>零食商品列表【案例三 + T4课后拓展】</h2>
        <div class="toolbar">
            <input
                v-model.trim="inputKeyword"
                @keyup.enter="confirmSearch"
                placeholder="输入商品名称，按下回车搜索"
            >
            <select v-model="category">
                <option value="all">全部分类</option>
                <option value="零食">零食</option>
            </select>
            <label>
                价格上限：
                <input type="range" min="0" max="30" step="0.5" v-model.number="priceMax">
                <span>{{ priceMax >=30 ? '不限' : priceMax }}</span>
            </label>
            <label>
                <input type="checkbox" v-model="isDesc">价格降序
            </label>
            <!-- T4：清空筛选按钮 -->
            <button @click="resetAllFilter">清空筛选</button>
            <!-- T4：右上角购物车数量 -->
            <div class="cart-text">购物车有 {{cartCount}} 件商品</div>
            <p v-show="realKeyword">共{{ filteredProducts.length }}件结果</p>
        </div>

        <div class="tip-empty" v-if="filteredProducts.length === 0">没有找到相关产品</div>

        <div class="container">
            <div
                class="card"
                :class="{active: selectedName === item.name}"
                v-for="item in filteredProducts"
                :key="item.id"
                @click="handleCardClick(item)"
            >
                <img :src="item.img" alt="零食图">
                <h4>{{item.name}}</h4>
                <p>类别：{{item.category}}</p>
                <p>单价：{{item.unitPrice}}元</p>
                <p>数量：{{item.quantity}}</p>
                <p>小计：{{(item.unitPrice*item.quantity).toFixed(2)}}元</p>
                <div class="card-footer">
                    <span></span>
                    <!-- stop！阻止点击按钮触发卡片选中高亮 -->
                    <button @click.stop="addToCart">加入购物车</button>
                </div>
            </div>
        </div>
    </div>
<script>
const { createApp, ref, computed, watch } = Vue;

const rawProducts = [
  { id:1, name: "芝士饼干", category: "零食", unitPrice: 12.44, quantity: 1, img:"1.png" },
  { id:2, name: "鱼肉薯条", category: "零食", unitPrice: 7.1, quantity: 2, img:"2.png" },
  { id:3, name: "咸蛋黄锅巴", category: "零食", unitPrice: 14.22, quantity: 1, img:"3.png" },
  { id:4, name: "膜片", category: "零食", unitPrice: 1.00, quantity: 1, img:"4.png" },
  { id:5, name: "芝士火鸡面", category: "零食", unitPrice: 5.2, quantity: 4, img:"5.png" },
  { id:6, name: "薯条", category: "零食", unitPrice: 17.99, quantity: 1, img:"6.png" },
  { id:7, name: "薯片", category: "零食", unitPrice: 8.9, quantity: 2, img:"7.png" },
  { id:8, name: "炭烤腰果", category: "零食", unitPrice: 25.30, quantity: 1, img:"8.png" },
  { id:9, name: "麻薯", category: "零食", unitPrice: 10.70, quantity: 1, img:"9.png" },
  { id:10, name: "鲜花饼", category: "零食", unitPrice: 9.90, quantity: 1, img:"10.png" }
];

//打印报告函数
const printReport = (productList) => {
  const totalSpend = productList.reduce((sum, item) => {
    return sum + item.unitPrice * item.quantity;
  }, 0);
  let mostExpensive = productList[0];
  for (const prod of productList) {
    if (prod.unitPrice > mostExpensive.unitPrice) {
      mostExpensive = prod;
    }
  }
  const categoryGroup = {};
  productList.forEach(item => {
    const cat = item.category;
    if (categoryGroup[cat] === undefined) {
      categoryGroup[cat] = 0;
    }
    categoryGroup[cat] += item.unitPrice * item.quantity;
  });
  const avgUnitPrice = productList.reduce((acc, p) => acc + p.unitPrice, 0) / productList.length;
  console.log("==========商品清单报告==========");
  productList.forEach(good => {
    const line = `商品：${good.name} | 类别：${good.category} | 单价：${good.unitPrice}元 | 数量：${good.quantity} | 小计：${(good.unitPrice * good.quantity).toFixed(2)}元`;
    console.log(line);
  });
  console.log("\n==========统计汇总==========");
  console.log(`总花费：${totalSpend.toFixed(2)} 元`);
  console.log(`最贵商品：${mostExpensive.name}，单价 ${mostExpensive.unitPrice} 元`);
  console.log(`平均单价：${avgUnitPrice.toFixed(2)} 元`);
  console.log("\n-----分类小计-----");
  for (const key in categoryGroup) {
    console.log(`${key}：${categoryGroup[key].toFixed(2)} 元`);
  }
};
printReport(rawProducts);

function getFilterProductList(list, keyword, category, priceMax, isDesc){
    let arr = [...list];
    const kw = keyword.trim().toLowerCase();
    if(kw){
        arr = arr.filter(p=> p.name.toLowerCase().includes(kw))
    }
    if(category !== 'all'){
        arr = arr.filter(p=> p.category === category)
    }
    arr = arr.filter(p=> p.unitPrice <= priceMax);
    arr.sort((a,b)=>{
        return isDesc ? b.unitPrice - a.unitPrice : a.unitPrice - b.unitPrice
    })
    return arr;
}

createApp({
    setup(){
        const productList = ref(rawProducts);
        const inputKeyword = ref('');
        const realKeyword = ref('');
        const category = ref('all');
        const priceMax = ref(30);
        const isDesc = ref(false);
        const selectedName = ref(null);
        // T4 购物车计数
        const cartCount = ref(0);

        //读取本地存储，多读取cartCount
        const storageStr = localStorage.getItem("snackCase3");
        if(storageStr){
            const obj = JSON.parse(storageStr);
            inputKeyword.value = obj.inputKeyword ?? '';
            realKeyword.value = obj.realKeyword ?? '';
            category.value = obj.category ?? 'all';
            priceMax.value = obj.priceMax ?? 30;
            isDesc.value = obj.isDesc ?? false;
            selectedName.value = obj.selectedName ?? null;
            cartCount.value = obj.cartCount ?? 0;
        }

        const confirmSearch = ()=>{
            realKeyword.value = inputKeyword.value.trim();
        }

        const handleCardClick = (item)=>{
            selectedName.value = selectedName.value === item.name ? null : item.name;
        }

        //T4：加入购物车
        const addToCart = ()=>{
            cartCount.value +=1;
        }

        //T4：清空全部筛选
        const resetAllFilter = ()=>{
            inputKeyword.value = '';
            realKeyword.value = '';
            category.value = 'all';
            priceMax.value = 30;
            isDesc.value = false;
            selectedName.value = null;
        }

        const filteredProducts = computed(()=>{
            return getFilterProductList(
                productList.value,
                realKeyword.value,
                category.value,
                priceMax.value,
                isDesc.value
            )
        })

        //保存时新增cartCount
        watch([inputKeyword, realKeyword, category, priceMax, isDesc, selectedName, cartCount], ()=>{
            const saveData = {
                inputKeyword: inputKeyword.value,
                realKeyword: realKeyword.value,
                category: category.value,
                priceMax: priceMax.value,
                isDesc: isDesc.value,
                selectedName: selectedName.value,
                cartCount: cartCount.value
            }
            localStorage.setItem("snackCase3", JSON.stringify(saveData));
        })

        return {
            inputKeyword,
            realKeyword,
            category,
            priceMax,
            isDesc,
            selectedName,
            filteredProducts,
            confirmSearch,
            handleCardClick,
            cartCount,
            addToCart,
            resetAllFilter
        }
    }
}).mount('#app')
</script>
</body>
</html>
