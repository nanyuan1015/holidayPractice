<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>零食商品卡片 案例二</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .toolbar {
            margin-bottom:20px;
            display:flex;
            gap:14px;
            align-items:center;
            flex-wrap:wrap;
        }
        .container{
            padding:20px;
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:16px;
        }
        .card{
            border:1px solid #ccc;
            padding:12px;
            border-radius:8px;
        }
        .card img{
            width:100%;
            height:180px;
            object-fit:cover;
        }
        .tip-empty {
            color:#999;
            font-size:18px;
            padding:10px 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <h2>零食商品列表【案例二：类别、价格过滤与排序】</h2>
        <div class="toolbar">
            <input v-model="keyword" placeholder="输入商品名称搜索"/>

            <!--分类下拉 -->
            <select v-model="category">
                <option value="all">全部分类</option>
                <option value="零食">零食</option>
            </select>

            <!--价格上限滑块 -->
            <label>
                价格上限：
                <input type="range" min="0" max="30" step="0.5" v-model.number="priceMax">
                <span>{{ priceMax >=30 ? '不限' : priceMax }}</span>
            </label>

            <label>
                <input type="checkbox" v-model="isDesc">价格降序
            </label>

            <p v-show="keyword">共{{ filteredProducts.length }}件结果</p>
        </div>

        <div class="tip-empty" v-if="filteredProducts.length === 0">没有找到相关产品</div>

        <div class="container">
            <div
                class="card"
                v-for="(item,index) in filteredProducts"
                :key="index"
            >
                <img :src="`${index+1}.png`" alt="零食图">
                <h4>{{item.name}}</h4>
                <p>类别：{{item.category}}</p>
                <p>单价：{{item.unitPrice}}元</p>
                <p>数量：{{item.quantity}}</p>
                <p>小计：{{(item.unitPrice*item.quantity).toFixed(2)}}元</p>
            </div>
        </div>
    </div>
<script>
const { createApp, ref, computed } = Vue;

const rawProducts = [
  { name: "芝士饼干", category: "零食", unitPrice: 12.44, quantity: 1 },
  { name: "鱼肉薯条", category: "零食", unitPrice: 7.1, quantity: 2 },
  { name: "咸蛋黄锅巴", category: "零食", unitPrice: 14.22, quantity: 1 },
  { name: "膜片", category: "零食", unitPrice: 1.00, quantity: 1 },
  { name: "芝士火鸡面", category: "零食", unitPrice: 5.2, quantity: 4 },
  { name: "薯条", category: "零食", unitPrice: 17.99, quantity: 1 },
  { name: "薯片", category: "零食", unitPrice: 8.9, quantity: 2 },
  { name: "炭烤腰果", category: "零食", unitPrice: 25.30, quantity: 1 },
  { name: "麻薯", category: "零食", unitPrice: 10.70, quantity: 1 },
  { name: "鲜花饼", category: "零食", unitPrice: 9.90, quantity: 1 }
];

//打印报告函数
const printReport = (productList) => {
  const totalSpend = productList.reduce((sum, item) => {
    return sum + item.unitPrice * item.quantity;
  }, 0);
  let mostExpensive = productList[0];
  for (const prod of productList) {
    if (prod.unitPrice > mostExpensive.unitPrice) {
      mostExpensive = prod;
    }
  }
  const categoryGroup = {};
  productList.forEach(item => {
    const cat = item.category;
    if (categoryGroup[cat] === undefined) {
      categoryGroup[cat] = 0;
    }
    categoryGroup[cat] += item.unitPrice * item.quantity;
  });
  const avgUnitPrice = productList.reduce((acc, p) => acc + p.unitPrice, 0) / productList.length;
  console.log("==========商品清单报告==========");
  productList.forEach(good => {
    const line = `商品：${good.name} | 类别：${good.category} | 单价：${good.unitPrice}元 | 数量：${good.quantity} | 小计：${(good.unitPrice * good.quantity).toFixed(2)}元`;
    console.log(line);
  });
  console.log("\n==========统计汇总==========");
  console.log(`总花费：${totalSpend.toFixed(2)} 元`);
  console.log(`最贵商品：${mostExpensive.name}，单价 ${mostExpensive.unitPrice} 元`);
  console.log(`平均单价：${avgUnitPrice.toFixed(2)} 元`);
  console.log("\n-----分类小计-----");
  for (const key in categoryGroup) {
    console.log(`${key}：${categoryGroup[key].toFixed(2)} 元`);
  }
};
printReport(rawProducts);

// 📌模拟composable：封装过滤排序逻辑（对应老师useProductFilter）
function getFilterProductList(list, keyword, category, priceMax, isDesc){
    //拷贝原数组，不污染原始数据
    let arr = [...list];
    //关键词过滤
    const kw = keyword.trim().toLowerCase();
    if(kw){
        arr = arr.filter(p=> p.name.toLowerCase().includes(kw))
    }
    //分类过滤
    if(category !== 'all'){
        arr = arr.filter(p=> p.category === category)
    }
    //价格上限过滤
    arr = arr.filter(p=> p.unitPrice <= priceMax);
    //排序
    arr.sort((a,b)=>{
        return isDesc ? b.unitPrice - a.unitPrice : a.unitPrice - b.unitPrice
    })
    return arr;
}

createApp({
    setup(){
        const productList = ref(rawProducts);
        //筛选状态
        const keyword = ref('');
        const category = ref('all');
        const priceMax = ref(30);
        const isDesc = ref(false);

        const filteredProducts = computed(()=>{
            //调用封装好的过滤函数
            return getFilterProductList(
                productList.value,
                keyword.value,
                category.value,
                priceMax.value,
                isDesc.value
            )
        })

        return {
            keyword,
            category,
            priceMax,
            isDesc,
            filteredProducts
        }
    }
}).mount('#app')
</script>
</body>
</html>
